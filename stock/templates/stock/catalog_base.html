{% extends 'stock/base.html' %}
{% block title %}Catalog{% endblock %}
{% block content %}
<style>
  .cat{ display:grid; gap:.9rem; grid-template-columns:minmax(0,1fr); }
  .cat-head{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:.5rem .8rem; }
  .cat-head h1{ margin:0; font-size:1.4rem; font-weight:800; }
  .cat-tabs{ display:flex; gap:1.1rem; overflow-x:auto; border-bottom:1px solid var(--app-border); }
  .cat-tabs a{ padding:.45rem 0; font-weight:700; font-size:.95rem; color:var(--app-muted); text-decoration:none; white-space:nowrap; border-bottom:2px solid transparent; }
  .cat-tabs a.on{ color:var(--app-text); border-bottom-color:var(--app-accent); }
  .cat-card{ background:var(--app-surface); border:1px solid var(--app-border); border-radius:var(--app-radius); padding:.35rem 1rem; }
  .cat-row{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.1rem .9rem; align-items:center; width:100%; padding:.55rem .1rem; border:0; border-top:1px solid var(--app-border); background:none; color:inherit; text-align:left; cursor:pointer; }
  .cat-row:first-child{ border-top:0; }
  .cat-row:hover{ background:var(--app-accent-soft); }
  .cat-row .main{ font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cat-row .sub{ grid-column:1 / -1; font-size:.85rem; color:var(--app-muted); min-width:0; }
  .cat-row .n{ font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .cat-form{ display:grid; gap:.55rem; }
  .cat-form label{ display:grid; gap:.2rem; margin:0; font-size:.85rem; font-weight:700; color:var(--app-muted); }
  .cat-check{ display:flex !important; align-items:center; gap:.45rem; color:var(--app-text) !important; min-height:38px; font-size:.95rem !important; }
  .cat-check input{ width:1.1rem; height:1.1rem; }
  .cat-warn{ font-size:.85rem; color:#92400e; }
  .cat-danger{ display:grid; gap:.45rem; width:100%; }
</style>
<div class="cat">
  <div class="cat-head">
    <h1>Catalog</h1>
    {% block catalog_action %}{% endblock %}
  </div>
  <nav class="cat-tabs" aria-label="Catalog">
    <a class="{% if tab == 'types' %}on{% endif %}" href="{% url 'catalog_types' %}">Types</a>
  </nav>
  {% block catalog %}{% endblock %}
</div>
{% endblock %}
