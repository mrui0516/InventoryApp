{% if url %}<img src="{{ url }}" alt="{{ name }}" loading="lazy" style="width:{{ size }}px;height:{{ size }}px;object-fit:contain;flex:none;vertical-align:middle">{% else %}<span aria-hidden="true" style="display:inline-grid;place-items:center;width:{{ size }}px;height:{{ size }}px;flex:none;border-radius:6px;background:var(--app-surface-2);color:var(--app-muted);font-weight:800;vertical-align:middle">{{ letter }}</span>{% endif %}
