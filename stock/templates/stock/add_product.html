{% extends 'stock/base.html' %}
{% block title %}Add perfume{% endblock %}
{% block content %}
<form id="product-form" method="post" enctype="multipart/form-data" novalidate>
  {% csrf_token %}
  <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
    <h1 class="pos-title mb-0">Add perfume</h1>
  </div>
  {% include "stock/_product_fields.html" %}
  <div class="pf-bar mt-3">
    <button type="submit" class="btn btn-primary">Save product</button>
    <a href="{% url 'product_list' %}" class="btn btn-outline-secondary" data-nav-back>Cancel</a>
  </div>
</form>
{% endblock %}
