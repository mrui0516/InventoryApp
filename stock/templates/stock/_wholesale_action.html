{% if row.state == 'out-stock' %}{% include "stock/_restock_ask.html" %}
{% elif row.price and row.pick_mode %}<div class="wc-add">
  <span class="wc-go"><button type="button" class="btn btn-sm btn-primary" data-layer="wc-pick-{{ row.pk }}">Escolher</button><span class="wc-incart" data-wc-incart="{{ row.pk }}" title="No carrinho: {{ row.in_cart }}">{% if row.in_cart %}{{ row.in_cart }}{% endif %}</span></span>
</div>
{% elif row.price %}<form method="post" action="{% url 'wholesale_cart_add' %}" class="wc-add" data-wc-add>
  {% csrf_token %}<input type="hidden" name="product" value="{{ row.pk }}"><input type="hidden" name="next" value="{{ request.get_full_path }}">
  <input type="number" name="quantity" value="1" min="1" max="999" inputmode="numeric" aria-label="Quantidade">
  <span class="wc-go"><button type="submit" class="btn btn-sm btn-primary">Adicionar</button><span class="wc-incart" data-wc-incart="{{ row.pk }}" title="No carrinho: {{ row.in_cart }}">{% if row.in_cart %}{{ row.in_cart }}{% endif %}</span></span>
</form>
{% else %}<span class="wc-asked">Contacte-nos</span>{% endif %}
