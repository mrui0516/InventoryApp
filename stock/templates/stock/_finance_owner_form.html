{# add (row=None) or change an entry of the owner's money #}
<form method="post" action="{% url 'finance_owner' %}" class="fin-form">
  {% csrf_token %}
  {% if row %}<input type="hidden" name="id" value="{{ row.id }}">{% endif %}
  <label>Shop
    <select name="store" class="form-select" required>
      {% for s in shops %}<option value="{{ s.id }}"{% if row and row.store_id == s.id or not row and shop and shop.id == s.id %} selected{% endif %}>{{ s.name }}</option>{% endfor %}
    </select></label>
  <label>Type
    <select name="kind" class="form-select">{% for v, l in kinds %}<option value="{{ v }}"{% if row and row.kind == v %} selected{% endif %}>{{ l }}</option>{% endfor %}</select></label>
  <label>Amount &euro;<input type="text" inputmode="decimal" name="amount" class="form-control" value="{% if row %}{{ row.amount }}{% endif %}" required></label>
  <label>Date<input type="date" name="date" class="form-control" value="{% if row %}{{ row.date|date:'Y-m-d' }}{% else %}{{ today|date:'Y-m-d' }}{% endif %}" required></label>
  <label>How
    <select name="method" class="form-select">{% for v, l in methods %}<option value="{{ v }}"{% if row and row.method == v %} selected{% endif %}>{{ l }}</option>{% endfor %}</select></label>
  <label class="wide">Note<input type="text" name="note" class="form-control" maxlength="200" value="{% if row %}{{ row.note }}{% endif %}"></label>
  <div class="wide"><button type="submit" class="btn btn-primary">Save</button></div>
</form>
