{% extends "stock/base.html" %}
{% block title %}Sign in{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-brand">KHAN<span>PERFUME</span></div>
  <div class="auth-title">Staff sign in</div>

  <form method="post" novalidate>
    {% csrf_token %}
    <div class="mb-3">
      <label for="login-username" class="form-label">Username</label>
      <input type="text" id="login-username" name="username" class="form-control"
             autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </div>
    <div class="mb-3">
      <label for="login-password" class="form-label">Password</label>
      <input type="password" id="login-password" name="password" class="form-control"
             autocomplete="current-password" required>
    </div>

    {% if form.errors %}
      <div class="alert alert-danger small py-2">Invalid username or password.</div>
    {% endif %}

    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>
</div>
{% endblock %}
