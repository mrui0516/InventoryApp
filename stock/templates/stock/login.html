{% extends "stock/base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="container" style="max-width:420px; margin-top:5rem;">
  <div class="card shadow-sm p-4">
    <h1 class="h3 mb-3 text-center">Login</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label for="login-username" class="form-label">Username</label>
        <input type="text" id="login-username" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label for="login-password" class="form-label">Password</label>
        <input type="password" id="login-password" name="password" class="form-control" required>
      </div>

      {% if form.errors %}
        <div class="alert alert-danger small">Invalid username or password.</div>
      {% endif %}

      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
  </div>
</div>
{% endblock %}
