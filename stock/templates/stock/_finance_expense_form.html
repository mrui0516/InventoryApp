{# add (row=None) or change an expense #}
<form method="post" action="{% url 'finance_expenses' %}" class="fin-form">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% if row %}<input type="hidden" name="id" value="{{ row.id }}">{% endif %}
  <label>Shop
    <select name="store" class="form-select" required>
      {% for s in shops %}<option value="{{ s.id }}"{% if row and row.store_id == s.id or not row and shop and shop.id == s.id %} selected{% endif %}>{{ s.name }}</option>{% endfor %}
    </select></label>
  <label>Category
    <select name="category" class="form-select" required>
      {% for c in categories %}{% if c.is_active or row and row.category_id == c.id %}<option value="{{ c.id }}"{% if row and row.category_id == c.id %} selected{% endif %}>{{ c.name }}</option>{% endif %}{% endfor %}
    </select></label>
  <label>Amount &euro;<input type="text" inputmode="decimal" name="amount" class="form-control" value="{% if row %}{{ row.amount }}{% endif %}" required></label>
  <label>Month<input type="month" name="month" class="form-control" value="{% if row %}{{ row.period|date:'Y-m' }}{% else %}{{ this_month }}{% endif %}" required></label>
  <label class="wide">Paid to<input type="text" name="payee" class="form-control" maxlength="120" value="{% if row %}{{ row.payee }}{% endif %}"></label>
  <label class="wide">Note<input type="text" name="note" class="form-control" maxlength="200" value="{% if row %}{{ row.note }}{% endif %}"></label>
  <label class="fin-check wide"><input type="checkbox" name="paid" value="1"{% if row and row.paid_on or not row %} checked{% endif %}> Paid</label>
  <label>Paid on<input type="date" name="paid_on" class="form-control" value="{% if row and row.paid_on %}{{ row.paid_on|date:'Y-m-d' }}{% else %}{{ today|date:'Y-m-d' }}{% endif %}"></label>
  <label>How
    <select name="method" class="form-select">
      {% for v, l in methods %}<option value="{{ v }}"{% if row and row.method == v or row and not row.method and v == last_method or not row and v == last_method %} selected{% endif %}>{{ l }}</option>{% endfor %}
    </select></label>
  <div class="wide"><button type="submit" class="btn btn-primary">Save</button></div>
</form>
