{% if row.requested %}<span class="wc-asked">Reposição pedida</span>
{% else %}<form method="post" action="{% url 'restock_request' row.pk %}" class="wc-ask">
  {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" class="btn btn-sm btn-outline-primary">Pedir reposição</button>
</form>{% endif %}
