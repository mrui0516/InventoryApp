{# the month's monthly costs still to confirm: finance overview and Monthly costs #}
{% for t in due %}
  <form method="post" class="fin-due" action="{% url 'finance_template_confirm' t.id %}">
    {% csrf_token %}
    <input type="hidden" name="month" value="{{ month.month_value }}">
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <div class="fin-due-what"><b>{{ t.category.name }}{% if t.payee %} &middot; {{ t.payee }}{% endif %}</b>
      {% if not shop %}<small>{{ t.store.name }}</small>{% endif %}</div>
    <div class="fin-due-do">
      <input type="text" inputmode="decimal" name="amount" class="form-control form-control-sm" value="{{ t.amount }}" aria-label="Amount">
      <label class="fin-check"><input type="checkbox" name="paid" value="1" checked> Paid</label>
      <select name="method" class="form-select form-select-sm" aria-label="How">{% for v, l in methods %}<option value="{{ v }}"{% if v == last_method %} selected{% endif %}>{{ l }}</option>{% endfor %}</select>
      <button type="submit" class="btn btn-sm btn-primary">Confirm</button>
      <button type="submit" class="btn btn-sm btn-outline-secondary" formaction="{% url 'finance_template_skip' t.id %}">Skip</button>
    </div>
  </form>
{% endfor %}
